spring.application.name=PhegonHotel
server.port=4040

# MYSQL CLOUD CONNECTION (For Render & Local Development)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/phegon_hotel_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Manish@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIBERNATE
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AWS S3 Dummy Configuration
aws.s3.access.key=dummy_access_key
aws.s3.secret.key=dummy_secret_key
aws.s3.bucket.name=dummy_bucket_name
